name: Pack standalone release
description: Install, build, and pack the standalone server
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install and build
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.33.4 --activate
        pnpm install --frozen-lockfile
        pnpm build
    - name: Pack release
      shell: bash
      run: |
        mkdir -p release/.next
        cp -a .next/standalone/. release/
        cp -a .next/static release/.next/static
        cp -a public release/public
        cp -a content release/content
        tar -C release -cJf portfolio.tar.xz .
