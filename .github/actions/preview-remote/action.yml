name: Preview remote
description: Install the preview host scripts and publish or remove one branch
inputs:
  command:
    description: preview or preview-remove
    required: true
  branch:
    description: Branch name
    required: true
  ssh_key:
    description: Deploy key
    required: true
  archive:
    description: Path to the standalone archive, used by preview
    required: false
    default: portfolio.tar.xz
outputs:
  url:
    description: Preview URL, empty when removing
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.ssh_key }}
        PREVIEW_COMMAND: ${{ inputs.command }}
        PREVIEW_BRANCH: ${{ inputs.branch }}
        PREVIEW_ARCHIVE: ${{ inputs.archive }}
      run: |
        set -euo pipefail
        if [ "$PREVIEW_COMMAND" != "preview" ] && [ "$PREVIEW_COMMAND" != "preview-remove" ]; then
          echo "Onbekend preview-commando." >&2
          exit 1
        fi
        corepack enable
        corepack prepare pnpm@10.33.4 --activate
        pnpm exec tsc -p deploy/tsconfig.json
        cp deploy/host-package.json deploy/dist/package.json
        cp deploy/run deploy/preview deploy/preview-remove deploy/dist/
        chmod 755 deploy/dist/run deploy/dist/preview deploy/dist/preview-remove
        slug=$(node deploy/dist/preview-cli.js slug "$PREVIEW_BRANCH")
        if ! printf '%s' "$slug" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
          echo "Ongeldige slug." >&2
          exit 1
        fi

        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' '136.144.146.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBBQ4SiFeHJWTIqwr34Cw6jJPoK7J/lYapT/zXb12tf/' >> ~/.ssh/known_hosts
        remote() {
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o LogLevel=ERROR arvinwerk@136.144.146.87 "$@"
        }

        probe_err=$(mktemp)
        mode=direct
        if probe_out=$(remote bootstrap-probe 2>"$probe_err"); then
          if [ "$probe_out" != "probe-ok" ]; then
            echo "Onverwacht antwoord van de VM." >&2
            printf '%s\n' "$probe_out" >&2
            exit 1
          fi
          mode=dispatcher
        elif grep -q "archive empty" "$probe_err"; then
          cat "$probe_err" >&2
          echo "De deploy-sleutel start alleen het bestaande commando run. Productie is niet aangeraakt." >&2
          echo "Zet eenmalig deploy/run ervoor, zoals in README.md onder Preview van een tak." >&2
          exit 1
        elif grep -Eq "Permission denied|Connection refused|Could not resolve" "$probe_err"; then
          cat "$probe_err" >&2
          exit 1
        fi
        rm -f "$probe_err"

        tar -C deploy/dist -cJf preview-host.tar.xz \
          package.json run preview preview-remove preview-cli.js slug.js env-file.js archive.js routes.js store.js proxy.js supervise.js errors.js

        if [ "$mode" = "dispatcher" ]; then
          remote bootstrap < preview-host.tar.xz
          if [ "$PREVIEW_COMMAND" = "preview" ]; then
            output=$(remote "preview $slug" < "$PREVIEW_ARCHIVE")
          else
            remote "preview-remove $slug"
            output=
          fi
        else
          lib=$(remote 'printf %s "$HOME/.local/lib/portfolio-preview"')
          case "$lib" in
            *[!/A-Za-z0-9._-]*) echo "Onverwacht installatiepad." >&2; exit 1 ;;
            *.local/lib/portfolio-preview) ;;
            *) echo "Onverwacht installatiepad." >&2; exit 1 ;;
          esac
          remote "mkdir -p '$lib' && tar -C '$lib' -xJf - && chmod 755 '$lib/preview' '$lib/preview-remove' '$lib/run'" < preview-host.tar.xz
          if [ "$PREVIEW_COMMAND" = "preview" ]; then
            output=$(remote "$lib/preview" "$slug" < "$PREVIEW_ARCHIVE")
          else
            remote "$lib/preview-remove" "$slug"
            output=
          fi
        fi

        if [ "$PREVIEW_COMMAND" = "preview" ]; then
          url=$(printf '%s\n' "$output" | sed -n 's/^preview-url=//p' | tail -n 1)
          if [ -z "$url" ]; then
            printf '%s\n' "$output" >&2
            echo "De preview gaf geen URL terug." >&2
            exit 1
          fi
          printf '%s\n' "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        else
          echo "url=" >> "$GITHUB_OUTPUT"
        fi
