# Eenmalig op de bestaande proxy. Vervang de hostnaam door PREVIEW_DOMAIN.
# Vul de certificaten in. proxy_buffering blijft uit, anders wacht /api/chat tot het model klaar is.

server {
    listen 443 ssl;
    server_name *.preview.example.nl;

    # ssl_certificate     /etc/ssl/preview.example.nl.pem;
    # ssl_certificate_key /etc/ssl/preview.example.nl.key;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}
