# Eenmalig op de bestaande proxy. Vervang de hostnaam door DEVELOPMENT_DOMAIN.
# proxy_buffering blijft uit, anders wacht /api/chat tot het model klaar is.
# Zet auth_basic aan zolang de chat-sleutel dezelfde is als productie.

server {
    listen 443 ssl;
    server_name development.example.nl;

    # ssl_certificate     /etc/ssl/development.example.nl.pem;
    # ssl_certificate_key /etc/ssl/development.example.nl.key;
    # auth_basic "development";
    # auth_basic_user_file /etc/nginx/development.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}
